name: Copy Source To Repo

# Reusable sync-to-mirror job (port of pipeline-library's
# copy-source-to-repo.yml / infrastructure-modules' sync-customer-modules):
# rsync the paths listed in a path-list file into a target repository,
# commit as the CI bot (GPG-signed with the armorsa CI bot kit), tag with
# the given version, and push over HTTPS with the bot's token.
# Content synced by this workflow should be validated in the SOURCE repo
# before release — the mirror receives it as-is.

on:
  workflow_call:
    inputs:
      target_repository:
        description: Repository the paths are synced into.
        required: true
        type: string
      source_org:
        description: GitHub organization hosting the target repository.
        required: false
        type: string
        default: armor
      path_list_file:
        description: File listing the paths to sync (one per line).
        required: false
        type: string
        default: .customer-modules
      version:
        description: Version used in the commit message and tag.
        required: true
        type: string
      commit_message:
        description: Commit message; defaults to the import-updates convention.
        required: false
        type: string
        default: ''
      committer_name:
        description: Committer name for the bot commits.
        required: false
        type: string
        default: armorsa
    secrets:
      GIT_TOKEN_BASIC:
        required: true
      CI_BOT_GPG_KEY:
        required: true
      CI_BOT_GPG_KEY_ID:
        required: true
      CI_BOT_GPG_KEY_PASSPHRASE:
        required: true
      CI_BOT_GPG_KEY_SUBJECT:
        required: true

jobs:
  copy-source:
    name: Sync to ${{ inputs.target_repository }}
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      SOURCE_ORG: ${{ inputs.source_org }}
      PATH_LIST_FILE: ${{ inputs.path_list_file }}
      SYNC_VERSION: ${{ inputs.version }}
      COMMITTER_NAME: ${{ inputs.committer_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          if ! [[ "$SYNC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$SYNC_VERSION' is not strict semver — refusing to proceed."
            exit 1
          fi

      - name: Import GPG signing key
        # The armorsa CI bot kit: key registered on the armorsa account, so
        # commits verify. Proven flow carried from the v1 workflows.
        env:
          GPG_KEY_BASE64: ${{ secrets.CI_BOT_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CI_BOT_GPG_KEY_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.CI_BOT_GPG_KEY_ID }}
          GPG_KEY_SUBJECT: ${{ secrets.CI_BOT_GPG_KEY_SUBJECT }}
        run: |
          # Key may be stored armored (org convention) or base64-wrapped —
          # import directly first, fall back to decoding.
          if ! printf '%s\n' "$GPG_KEY_BASE64" | gpg --batch --yes --no-tty --always-trust --import; then
            printf '%s\n' "$GPG_KEY_BASE64" | base64 -d | gpg --batch --yes --no-tty --always-trust --import
          fi
          echo "ENCRYPTION_TEST" | gpg --always-trust --encrypt --recipient "$GPG_KEY_SUBJECT" > temp.encrypted
          gpg --batch --yes --no-tty --decrypt --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --always-trust temp.encrypted
          rm -f temp.encrypted
          git config --global user.signingkey "$GPG_KEY_ID"
          git config --global commit.gpgsign true
          git config --global user.name "$COMMITTER_NAME"
          git config --global user.email "$GPG_KEY_SUBJECT"

      - name: Clone target repository
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN_BASIC }}
        run: git clone "https://x-access-token:${GIT_TOKEN}@github.com/${SOURCE_ORG}/${TARGET_REPOSITORY}.git"

      - name: Sync paths
        run: |
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rsync -vr -R --delete "$path" "$TARGET_REPOSITORY"
          done < "$PATH_LIST_FILE"

      - name: Commit, tag and push
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          cd "$TARGET_REPOSITORY"
          MESSAGE="${COMMIT_MESSAGE:-Import updates from ${GITHUB_REPOSITORY#*/}@${SYNC_VERSION} (patch)}"
          git add -A
          git commit --allow-empty -m "$MESSAGE"
          git tag "$SYNC_VERSION"
          git push
          git push --tags
